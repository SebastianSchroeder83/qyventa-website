name: Fix Produktdemo button contrast

on:
  push:
    paths:
      - '.github/workflows/fix-demo-button.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve secondary button contrast
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = ".secondary{border:1px solid var(--line);background:rgba(255,255,255,.04)}.secondary:hover{background:rgba(255,255,255,.09)}"
          new = ".secondary{color:#fff;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);cursor:pointer}.secondary:hover{color:#fff;background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.42);transform:translateY(-2px)}"
          if old not in s:
              raise SystemExit('Expected secondary button CSS not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "Qyventa Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Produktdemo button visibility"
          git push
